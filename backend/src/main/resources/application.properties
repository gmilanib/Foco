spring.application.name=foco-backend
spring.datasource.url=jdbc:sqlite:${FOCO_DATA_DIR:${user.home}/AppData/Local/FocoJava}/foco.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/schema.sql
spring.jackson.default-property-inclusion=non_null
server.address=127.0.0.1
server.port=${FOCO_PORT:0}
server.error.include-message=never
spring.main.banner-mode=off
