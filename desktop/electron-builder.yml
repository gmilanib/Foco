appId: br.com.foco.desktop
productName: Foco
directories:
  output: release
files:
  - desktop/dist/**
  - package.json
extraResources:
  - from: backend/target/foco-backend.jar
    to: backend/foco-backend.jar
  - from: desktop/build/Foco.ico
    to: Foco.ico
win:
  target: nsis
  icon: desktop/build/Foco.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
