appId: br.com.foco.desktop.new
productName: Foco New
directories:
  output: release/New
artifactName: Foco-New-Setup-${version}.${ext}
files:
  - desktop/dist/**
  - package.json
extraResources:
  - from: backend/target/foco-backend.jar
    to: backend/foco-backend.jar
  - from: desktop/build/Foco.ico
    to: Foco.ico
win:
  target: nsis
  icon: desktop/build/Foco.ico
nsis:
  include: desktop/build/installer.nsh
  oneClick: true
  perMachine: false
  runAfterFinish: false
