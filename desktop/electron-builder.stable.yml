appId: br.com.foco.desktop
productName: Foco Stable
directories:
  output: release/Stable
artifactName: Foco-Stable-Setup-${version}.${ext}
files:
  - desktop/dist/**
  - package.json
extraResources:
  - from: backend/target/foco-backend.jar
    to: backend/foco-backend.jar
  - from: desktop/build/Foco.ico
    to: Foco.ico
  - from: desktop/build/Foco.png
    to: Foco.png
win:
  target: nsis
  icon: desktop/build/Foco.ico
nsis:
  include: desktop/build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: rpm
      arch: [x64]
  executableName: foco-stable
  icon: desktop/build/Foco.png
  category: Office
  artifactName: Foco-Stable-${version}-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: foco-java
rpm:
  packageName: foco-stable
  maintainer: Foco Java
  fpm:
    - --rpm-rpmbuild-define=_build_id_links none
  depends:
    - java-17-openjdk
    - gtk3
    - nss
    - libXScrnSaver
    - alsa-lib
    - libXtst
    - xdg-utils
    - at-spi2-core
    - libuuid
    - libsecret
